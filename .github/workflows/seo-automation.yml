name: SEO Automation

on:
  schedule:
    # Mondays 14:00 UTC — weekly health + IndexNow + scoreboard
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run SEO automation
        env:
          SEO_LIVE_BASE: https://neatclock.pro
          PLAUSIBLE_API_KEY: ${{ secrets.PLAUSIBLE_API_KEY }}
          PLAUSIBLE_SITE_ID: neatclock.pro
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_OPS_DATABASE_ID: ${{ secrets.NOTION_OPS_DATABASE_ID }}
          OPS_WEBHOOK_URL: ${{ secrets.OPS_WEBHOOK_URL }}
        run: node scripts/seo-automate.mjs

      - name: Sync Formspree leads → Notion
        env:
          FORMSPREE_API_KEY: ${{ secrets.FORMSPREE_API_KEY }}
          FORMSPREE_FORM_ID: xqevpwlb
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_LEADS_DATABASE_ID: ${{ secrets.NOTION_LEADS_DATABASE_ID }}
        run: node scripts/sync-leads-notion.mjs

      - name: Commit scoreboard / sitemap / LLM catalog / lead cursor updates
        run: |
          if git diff --quiet -- docs/TRAFFIC-SCOREBOARD.md public/sitemap.xml public/catalog.json public/llms.txt public/llms-full.txt docs/.formspree-leads-sync.json; then
            echo "no seo file changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/TRAFFIC-SCOREBOARD.md public/sitemap.xml public/catalog.json public/llms.txt public/llms-full.txt docs/.formspree-leads-sync.json 2>/dev/null || true
            git commit -m "chore(seo): automated weekly scoreboard/sitemap/llms [skip ci]" || echo "nothing to commit"
            git push
          fi

      - name: Open weekly distribution checklist issue
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `SEO distribution week — ${new Date().toISOString().slice(0, 10)}`;
            const body = [
              '## Automated weekly SEO checklist',
              '',
              'Generated by `.github/workflows/seo-automation.yml`.',
              '',
              '### Verify',
              '- [ ] Plausible shows landing pageviews (not only `/`)',
              '- [ ] Goals firing: `landing_cta`, `ics_export`, `interest_submit`',
              '- [ ] `docs/TRAFFIC-SCOREBOARD.md` has today\'s row (auto if `PLAUSIBLE_API_KEY` secret is set)',
              '',
              '### Distribute (max 3)',
              '- [ ] **Mon** Pinterest → `/home-maintenance-calendar` (see `docs/DISTRIBUTION-WEEKLY.md`)',
              '- [ ] **Wed** Reddit value post → intent landing (not homepage)',
              '- [ ] **Fri** TikTok/Shorts → kit CTA from `videos/sunday-reset-*`',
              '',
              '### Indexing',
              '- [ ] GSC: inspect any new landings from the past week',
              '- IndexNow already re-pinged by this workflow',
              '',
              'Playbook: `docs/SEO-AUTOMATION.md` · Ops: `docs/OPS-AUTOMATION.md`',
            ].join('\n');

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 20,
            });
            if (issues.data.some((i) => i.title.startsWith('SEO distribution week'))) {
              console.log('open weekly SEO issue already exists — skip');
              return;
            }
            try {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['seo-weekly'],
              });
            } catch (err) {
              // Label may not exist yet — create unlabeled
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

      - name: Notify Zapier / Notion (weekly ops)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_OPS_DATABASE_ID: ${{ secrets.NOTION_OPS_DATABASE_ID }}
          OPS_WEBHOOK_URL: ${{ secrets.OPS_WEBHOOK_URL }}
        run: |
          node scripts/notify-ops.mjs \
            --event weekly_seo \
            --title "SEO distribution week" \
            --source github-actions-seo \
            --url https://neatclock.pro/guides \
            --url https://neatclock.pro/llms.txt \
            --url https://neatclock.pro/catalog.json \
            --checklist "Verify Plausible landing pageviews + landing_cta / ics_export / interest_submit" \
            --checklist "Mon Pinterest → /home-maintenance-calendar (docs/DISTRIBUTION-WEEKLY.md)" \
            --checklist "Wed Reddit value post → intent landing (not homepage)" \
            --checklist "Fri TikTok/Shorts → videos/sunday-reset-* kit CTA" \
            --checklist "GSC: inspect any new landings from the past week"
