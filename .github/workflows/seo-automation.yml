name: SEO Automation

on:
  schedule:
    # Mondays 14:00 UTC — weekly health + IndexNow + scoreboard
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Run SEO automation
        env:
          SEO_LIVE_BASE: https://neatclock.pro
          PLAUSIBLE_API_KEY: ${{ secrets.PLAUSIBLE_API_KEY }}
          PLAUSIBLE_SITE_ID: neatclock.pro
        run: node scripts/seo-automate.mjs

      - name: Commit scoreboard / sitemap updates
        run: |
          if git diff --quiet -- docs/TRAFFIC-SCOREBOARD.md public/sitemap.xml; then
            echo "no seo file changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/TRAFFIC-SCOREBOARD.md public/sitemap.xml
            git commit -m "chore(seo): automated weekly scoreboard/sitemap [skip ci]"
            git push
          fi

      - name: Open weekly distribution checklist issue
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `SEO distribution week — ${new Date().toISOString().slice(0, 10)}`;
            const body = [
              '## Automated weekly SEO checklist',
              '',
              'Generated by `.github/workflows/seo-automation.yml`.',
              '',
              '### Verify',
              '- [ ] Plausible shows landing pageviews (not only `/`)',
              '- [ ] Goals firing: `landing_cta`, `ics_export`, `interest_submit`',
              '- [ ] `docs/TRAFFIC-SCOREBOARD.md` has today\'s row (auto if `PLAUSIBLE_API_KEY` secret is set)',
              '',
              '### Distribute (max 3)',
              '- [ ] **Mon** Pinterest → `/home-maintenance-calendar` (see `docs/DISTRIBUTION-WEEKLY.md`)',
              '- [ ] **Wed** Reddit value post → intent landing (not homepage)',
              '- [ ] **Fri** TikTok/Shorts → kit CTA from `videos/sunday-reset-*`',
              '',
              '### Indexing',
              '- [ ] GSC: inspect any new landings from the past week',
              '- IndexNow already re-pinged by this workflow',
              '',
              'Playbook: `docs/SEO-AUTOMATION.md`',
            ].join('\n');

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 20,
            });
            if (issues.data.some((i) => i.title.startsWith('SEO distribution week'))) {
              console.log('open weekly SEO issue already exists — skip');
              return;
            }
            try {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['seo-weekly'],
              });
            } catch (err) {
              // Label may not exist yet — create unlabeled
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
