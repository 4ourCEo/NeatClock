name: IndexNow

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/sitemap.xml"
      - "public/*.html"
      - "scripts/submit-indexnow.mjs"
      - "scripts/update-sitemap.mjs"
  # Backup re-ping even when no content ships
  schedule:
    - cron: "0 15 * * 3"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Refresh sitemap lastmod dates from git history
        run: node scripts/update-sitemap.mjs

      - name: Commit sitemap changes, if any
        run: |
          if ! git diff --quiet -- public/sitemap.xml; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/sitemap.xml
            git commit -m "chore(seo): refresh sitemap lastmod dates [skip ci]"
            git push
          else
            echo "sitemap.xml unchanged"
          fi

      - name: Submit URLs to IndexNow
        run: node scripts/submit-indexnow.mjs

      - name: Notify Zapier / Notion (new landings on push)
        if: github.event_name == 'push'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_OPS_DATABASE_ID: ${{ secrets.NOTION_OPS_DATABASE_ID }}
          OPS_WEBHOOK_URL: ${{ secrets.OPS_WEBHOOK_URL }}
        run: |
          urls=()
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            slug="${f#public/}"
            slug="${slug%.html}"
            urls+=(--url "https://neatclock.pro/${slug}")
          done < <(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- 'public/*.html' 2>/dev/null || true)
          if [ ${#urls[@]} -eq 0 ]; then
            echo "no public HTML changes — skip landing notify"
            exit 0
          fi
          node scripts/notify-ops.mjs \
            --event landing_indexed \
            --title "New or updated landings — IndexNow submitted" \
            --source github-actions-indexnow \
            --checklist "GSC URL Inspection for each URL below" \
            --checklist "Confirm https://neatclock.pro/catalog.json lists the new pages" \
            "${urls[@]}"
