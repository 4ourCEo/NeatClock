name: IndexNow

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/sitemap.xml"
      - "public/*.html"
      - "scripts/submit-indexnow.mjs"
      - "scripts/update-sitemap.mjs"

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh sitemap lastmod dates from git history
        run: node scripts/update-sitemap.mjs

      - name: Commit sitemap changes, if any
        run: |
          if ! git diff --quiet -- public/sitemap.xml; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/sitemap.xml
            git commit -m "chore(seo): refresh sitemap lastmod dates [skip ci]"
            git push
          else
            echo "sitemap.xml unchanged"
          fi

      - name: Submit URLs to IndexNow
        run: node scripts/submit-indexnow.mjs
