name: IndexNow

on:
  push:
    branches: [main]
    paths:
      - "public/sitemap.xml"
      - "scripts/submit-indexnow.mjs"
      - "public/*.html"

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node scripts/submit-indexnow.mjs
